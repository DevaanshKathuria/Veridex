name: veridex

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongo_data:/data/db
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    mem_limit: 448m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms640m -Xmx640m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    mem_limit: 1280m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 45s

  ml:
    build: ./ml
    restart: unless-stopped
    env_file: ${VERIDEX_ENV_FILE:-.env.production}
    expose:
      - "8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    mem_limit: 4g
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  api:
    build: ./api
    restart: unless-stopped
    env_file: ${VERIDEX_ENV_FILE:-.env.production}
    expose:
      - "4000"
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: ./worker
    restart: unless-stopped
    env_file: ${VERIDEX_ENV_FILE:-.env.production}
    mem_limit: 768m
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    mem_limit: 512m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
  es_data:
  hf_cache:
  caddy_data:
  caddy_config:
